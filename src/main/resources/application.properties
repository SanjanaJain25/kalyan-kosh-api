spring.servlet.multipart.max-request-size=20MB
server.tomcat.max-http-form-post-size=20MB
server.tomcat.max-swallow-size=20MB
# ============================================
# File Storage Configuration
# ============================================
# Storage type: 'local' or 's3'
# Set to 's3' to use AWS S3, 'local' for local file system
# For local development, use 'local'. For production (EC2), use 's3'
# Local testing: files are stored under uploads/tab1|tab2|tab3/...
storage.type=s3
# For production, change this to: storage.type=s3
# AWS S3 Configuration (required when storage.type=s3)
# Set these values via environment variables for security
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME:pmum-qr-death-case}
aws.s3.region=${AWS_S3_REGION:ap-south-1}
aws.s3.access-key=${AWS_S3_ACCESS_KEY:}
aws.s3.secret-key=${AWS_S3_SECRET_KEY:}
