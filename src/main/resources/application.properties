spring.application.name=kalyan-kosh-api

# ============================================
# Multi-Portal Local Database Configuration
# ============================================
# Only ONE Spring Boot backend runs. It routes each request to TAB1/TAB2/TAB3.
app.portal.default-code=${APP_PORTAL_DEFAULT_CODE:TAB1}
app.portal.require-header=${APP_PORTAL_REQUIRE_HEADER:false}
# Production-safe default: portal databases are provisioned explicitly.
# Set APP_PORTAL_AUTO_CREATE_DATABASES=true only for controlled provisioning/dev.
app.portal.auto-create-databases=${APP_PORTAL_AUTO_CREATE_DATABASES:false}

# MySQL server login used to create/check the three local databases.
app.portal.server-url=${DB_SERVER_URL:jdbc:mysql://localhost:3306}
app.portal.username=${DB_USERNAME:root}
app.portal.password=${DB_PASSWORD:download}
app.portal.jdbc-parameters=allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8

# Existing working database is the schema source and remains TAB1.
app.portal.source-database=${APP_PORTAL_SOURCE_DATABASE:kalyankosh_db}
app.portal.flyway-baseline-version=${APP_PORTAL_FLYWAY_BASELINE_VERSION:8}

# TAB1 is the primary/live portal. Optional portals stay off until explicitly released.
app.portal.databases.tab1.enabled=${APP_PORTAL_DATABASES_TAB1_ENABLED:true}
app.portal.databases.tab1.database-name=${APP_PORTAL_DATABASES_TAB1_NAME:kalyankosh_db}
app.portal.databases.tab2.enabled=${APP_PORTAL_DATABASES_TAB2_ENABLED:false}
app.portal.databases.tab2.database-name=${APP_PORTAL_DATABASES_TAB2_NAME:kalyankosh_tab2}
app.portal.databases.tab3.enabled=${APP_PORTAL_DATABASES_TAB3_ENABLED:false}
app.portal.databases.tab3.database-name=${APP_PORTAL_DATABASES_TAB3_NAME:kalyankosh_tab3}

# Database creation/schema cloning is handled by PortalDatabaseProvisioner.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

app.jwt.secret=${JWT_SECRET:change_this_to_a_very_long_secret_key_please_change}
app.jwt.expiration-ms=${JWT_EXP_MS:43200000}
app.jwt.mobile-expiration-ms=${MOBILE_JWT_EXP_MS:315360000000}
# JWT expiration: 43200000 ms = 12 hours (comment moved to new line)

server.port=8080

# Local seed account. Override with environment variables when required.
app.seed.super-admin.id=${SUPER_ADMIN_ID:PMUMS202502}
app.seed.super-admin.password=${SUPER_ADMIN_PASSWORD:Jyoti@7909}
app.seed.super-admin.email=${SUPER_ADMIN_EMAIL:superadmin@pmums.com}
app.seed.super-admin.mobile=${SUPER_ADMIN_MOBILE:9999999999}
logging.level.org.springframework.security=DEBUG
logging.level.com.example.kalyan_kosh_api.config=DEBUG

